[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentauth"
version = "1.0.0"
description = "Python SDK for AgentAuth - Identity & Permissions for AI Agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "AgentAuth", email = "support@agentauth.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.28.0",
]

[project.urls]
Homepage = "https://github.com/jjssmyhaks-dev/agentauth"
Documentation = "https://github.com/jjssmyhaks-dev/agentauth/tree/main/sdk-python"
Repository = "https://github.com/jjssmyhaks-dev/agentauth"

[tool.setuptools.packages.find]
include = ["agentauth*"]
