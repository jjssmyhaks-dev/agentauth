name: Release

# Tag-driven release pipeline. Every artifact CI can build ends up
# downloadable/deployable from this workflow:
#   - dashboard static bundle → Actions artifact (v4.x-dist.zip)
#   - backend + Next.js dashboard → GHCR container image (Dockerfile)
#   - GitHub Release with auto-generated notes on the tag
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  dashboard-artifact:
    name: Dashboard static bundle (root Vite app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build dashboard
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: dist/
          retention-days: 90
          if-no-files-found: error

  docker-image:
    name: Backend + dashboard image (GHCR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [dashboard-artifact, docker-image]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5

      - name: Download dashboard bundle
        uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: dist

      - name: Zip dashboard bundle
        run: cd dist && zip -r ../agentauth-dashboard-${{ github.ref_name }}.zip . && cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: agentauth-dashboard-${{ github.ref_name }}.zip
