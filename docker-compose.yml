# AgentAuth local stack: Postgres + Redis + API + dashboard.
#   docker compose up --build
#   dashboard  → http://localhost:3000   (Next.js dashboard served from the image)
#   API docs   → http://localhost:4000/docs
# The root Vite dashboard is not in the image — run it with `npm run dev` and
# VITE_API_URL=http://localhost:4000, or grab its static bundle from a Release.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentauth
      POSTGRES_PASSWORD: agentauth
      POSTGRES_DB: agentauth
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentauth"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    # Run only the API stage of the multi-stage Dockerfile.
    command: ["node", "backend/dist/main.js"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://agentauth:agentauth@db:5432/agentauth
      REDIS_URL: redis://redis:6379
      PORT: 4000
      CORS_ORIGIN: http://localhost:5173
      TOKEN_TTL_MINUTES: 10
    ports:
      - "4000:4000"

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    # The image ships backend + Next.js standalone server (see Dockerfile).
    command: ["node", "server.js"]
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
