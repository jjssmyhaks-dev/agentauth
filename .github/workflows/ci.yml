name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dashboard:
    name: Dashboard (root Vite app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  backend:
    name: Backend (NestJS API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --silent

  frontend:
    name: Dashboard (Next.js app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx --no-install tsc --noEmit

      - name: Build
        run: npm run build

  rls-isolation:
    name: RLS tenant-isolation (leakage test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentauth
          POSTGRES_PASSWORD: agentauth
          POSTGRES_DB: agentauth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentauth"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: backend

      - name: Build backend
        run: npm run build
        working-directory: backend

      # Boot the real app once so TypeORM synchronize creates the base schema;
      # the RLS script then applies its policies on top. RLS itself is tested
      # over throwaway non-owner connections, never the app's role.
      - name: Sync database schema (TypeORM synchronize on boot)
        run: node dist/main.js & disown; sleep 1
        working-directory: backend
        env:
          PORT: "4999"
          DATABASE_URL: postgres://agentauth:agentauth@localhost:5432/agentauth
          REDIS_URL: redis://localhost:6379

      - name: Wait for schema sync
        run: |
          for i in $(seq 1 40); do
            if curl -sf -m 2 http://127.0.0.1:4999/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf -m 2 http://127.0.0.1:4999/health

      - name: RLS tenant-isolation leakage test
        working-directory: backend
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: agentauth
          PGPASSWORD: agentauth
          PGDATABASE: agentauth
        run: node scripts/rls-leakage-test.js

  e2e:
    name: E2E (golden path)
    runs-on: ubuntu-latest
    needs: [dashboard, backend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentauth
          POSTGRES_PASSWORD: agentauth
          POSTGRES_DB: agentauth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentauth"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Install backend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: backend

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run golden path E2E
        env:
          E2E_DATABASE_URL: postgres://agentauth:agentauth@localhost:5432/agentauth
          E2E_REDIS_URL: redis://localhost:6379
        run: npx playwright test

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
