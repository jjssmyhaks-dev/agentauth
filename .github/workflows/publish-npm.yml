name: Publish to npm

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: cd sdk && bun install && bun run build
      - uses: JS-DevTools/npm-publish@v3
        with:
          package: sdk/package.json
          token: ${{ secrets.NPM_TOKEN }}
